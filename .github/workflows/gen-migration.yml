name: Generate migration
on:
  push:
    branches: [ tools/generate-migration ]
    paths: [ '.github/workflows/gen-migration.yml' ]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci_Test_Pass123!
        ports: [ "1433:1433" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.13
      - run: dotnet build MotoGrid.slnx
      - run: sleep 20
      - name: Apply migration to real SQL Server
        run: dotnet ef database update --project src/MotoGrid.Data --startup-project src/MotoGrid.Web --connection "Server=localhost,1433;Database=MotoGridCi;User Id=sa;Password=Ci_Test_Pass123!;TrustServerCertificate=True"
